# Tes combos. Écris-les comme sur les forums, l'outil les comprend :
# b/f/d/u/db/df (ou d/b) = directions, cr./st. = accroupi/debout,
# qcf/qcb/hcf/hcb/dp = mouvements, pp/kk = version OD, xx ou > = cancel, "," = link.
# Les remarques entre parenthèses, comme (pc), sont ignorées.
# Change de combo avec les flèches de l'overlay (ou : cargo run -- 2 pour le deuxième au lancement).
#
# hits   : coups qui touchent quand le combo passe (sinon appris avec Select).
# degats : dégâts du combo complet (panneau « Combo Damage » du training).
# Le combo est validé si les hits OU les dégâts sont atteints.
personnage = "Dhalsim"

# --- Drive Rush ---

[[combo]]
nom = "Drive Rush, Yoga Flame"
inputs = "b+hp xx DR xx b+mk xx qcf+mk, b+mk xx hcb+mp"
hits = 6
degats = 2346

