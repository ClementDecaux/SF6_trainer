# Actions possibles : LP, MP, HP, LK, MK, HK, DP (Drive Parry), DI (Drive Impact), Throw
West = "LP"
North = "MP"
RightTrigger = "HP"
South = "LK"
East = "MK"
RightTrigger2 = "HK"
LeftTrigger = "DP"
