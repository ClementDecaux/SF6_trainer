[package]
name = "sf6-trainer"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
colored = "3.1.1"
# Fenêtre de l'overlay. Rendu OpenGL (glow) : la transparence y marche mieux sous Windows.
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.37", features = ["svg"] }
fastrand = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

# Windows uniquement : appels directs à l'API Windows (manette XInput, horloge, fenêtre de
# l'overlay, son, touche F8).
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Media", "Win32_Media_Audio", "Win32_System_Performance", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_XboxController", "Win32_UI_WindowsAndMessaging"] }
# Capture vidéo de la fenêtre de SF6 et encodage MP4 par Windows (étape 7).
windows-capture = "2.0"
# Lecture des vidéos dans l'interface (décodage par Media Foundation, inclus dans Windows),
# et écoute du son du jeu pour les vidéos (WASAPI).
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_Media_MediaFoundation", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Variant"] }
# Pour écrire en Rust un objet COM appelé par Windows (fin de préparation de l'écoute du son).
windows-core = "0.62"

# Hors Windows (Linux, pour développer) : la manette est lue par gilrs.
[target.'cfg(not(windows))'.dependencies]
gilrs = "0.11"

[dev-dependencies]
png = "0.18"
